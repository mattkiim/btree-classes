<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">State values under a fixed Gridworld policy</title>
  <desc id="description">A three-by-three value map with values 9, 10, 0 in the first row; 8, wall, 10 in the second; and 7, 6, 0 in the third.</desc>
  <rect width="900" height="520" fill="#f8fafc"/>
  <text x="450" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172033">Future reward under the fixed policy</text>

  <g transform="translate(180 85)" stroke="#334155" stroke-width="4">
    <rect x="0" y="0" width="180" height="120" fill="#d1fae5"/>
    <rect x="180" y="0" width="180" height="120" fill="#a7f3d0"/>
    <rect x="360" y="0" width="180" height="120" fill="#e2e8f0"/>
    <rect x="0" y="120" width="180" height="120" fill="#dcfce7"/>
    <rect x="180" y="120" width="180" height="120" fill="#475569"/>
    <rect x="360" y="120" width="180" height="120" fill="#a7f3d0"/>
    <rect x="0" y="240" width="180" height="120" fill="#ecfdf5"/>
    <rect x="180" y="240" width="180" height="120" fill="#f0fdf4"/>
    <rect x="360" y="240" width="180" height="120" fill="#e2e8f0"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033">
    <text x="270" y="145" font-size="45" font-weight="700">9</text>
    <text x="270" y="180" font-size="20">→</text>
    <text x="450" y="145" font-size="45" font-weight="700">10</text>
    <text x="450" y="180" font-size="20">→</text>
    <text x="630" y="140" font-size="42" font-weight="700">0</text>
    <text x="630" y="177" font-size="19">terminal</text>

    <text x="270" y="265" font-size="45" font-weight="700">8</text>
    <text x="270" y="300" font-size="20">↑</text>
    <text x="450" y="272" font-size="28" font-weight="700" fill="#ffffff">WALL</text>
    <text x="630" y="265" font-size="45" font-weight="700">10</text>
    <text x="630" y="300" font-size="20">↑</text>

    <text x="270" y="385" font-size="45" font-weight="700">7</text>
    <text x="270" y="420" font-size="20">↑</text>
    <text x="450" y="385" font-size="45" font-weight="700">6</text>
    <text x="450" y="420" font-size="20">←</text>
    <text x="630" y="380" font-size="42" font-weight="700">0</text>
    <text x="630" y="417" font-size="19">terminal</text>
  </g>

  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">The number in each open square is its state value—not its immediate reward.</text>
</svg>
